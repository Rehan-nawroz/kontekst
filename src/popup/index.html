<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontext</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }

    .header {
      padding: 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e94560;
    }

    .content {
      padding: 16px;
    }

    .platform-selector {
      margin-bottom: 12px;
    }

    .platform-selector label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .platform-selector select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #0f3460;
      background: #16213e;
      color: #eee;
      font-size: 14px;
    }

    .export-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .export-btn:hover {
      background: #c73e54;
    }

    .export-btn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./App.tsx"></script>
</body>
</html>
